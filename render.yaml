services:
  - type: web
    name: nova-study-hub
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir fastapi uvicorn pydantic python-dotenv rich pypdf pymupdf google-genai requests beautifulsoup4 huggingface_hub edge-tts
    startCommand: python main.py --web
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: HF_DATASET_REPO
        value: AlexLlorca/unir-study-hub-data
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HUB_ACCESS_TOKEN
        sync: false
      - key: HF_TOKEN
        sync: false
      # Contraseña de la cuenta admin. OBLIGATORIA: si no existe,
      # el primer arranque genera una aleatoria que solo aparece en los logs.
      # Debe ser distinta a HUB_ACCESS_TOKEN.
      - key: HUB_ADMIN_PASSWORD
        sync: false
