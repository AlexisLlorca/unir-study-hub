<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.4" />

  <!-- Graduation Cap (Mortarboard) -->
  <g filter="url(#glow)">
    <!-- Top Diamond -->
    <path d="M 256 120 L 440 210 L 256 300 L 72 210 Z" fill="url(#capGrad)" />
    
    <!-- Under Skullcap -->
    <path d="M 140 252 L 140 326 C 140 376 372 376 372 326 L 372 252 C 336 276 296 288 256 288 C 216 288 176 276 140 252 Z" fill="#f8fafc" />
    
    <!-- Button on Top -->
    <ellipse cx="256" cy="210" rx="14" ry="10" fill="url(#goldGrad)" />
    
    <!-- Tassel Ribbon & Bobble -->
    <path d="M 256 215 Q 380 230 405 310 L 395 365" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <circle cx="395" cy="370" r="10" fill="url(#goldGrad)" />
  </g>

  <!-- Subtitle Text "NOVA" -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">NOVA</text>
</svg>
